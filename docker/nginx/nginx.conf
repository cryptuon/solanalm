# SolanaLM Production Nginx Configuration
# TLS termination, rate limiting, and reverse proxy

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/x-javascript;

    # Hide nginx version
    server_tokens off;

    # Rate limiting zones
    # Inference requests: 30 req/min per IP
    limit_req_zone $binary_remote_addr zone=inference_limit:10m rate=30r/m;
    # Private inference: 10 req/min per IP
    limit_req_zone $binary_remote_addr zone=private_inference_limit:10m rate=10r/m;
    # Node registration: 5 req/min per IP
    limit_req_zone $binary_remote_addr zone=node_register_limit:10m rate=5r/m;
    # General API: 100 req/min per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream gateway servers
    upstream solanalm_gateway {
        server gateway:8001;
        keepalive 32;
    }

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Health check endpoint (no redirect)
        location /health {
            proxy_pass http://solanalm_gateway/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # Modern TLS configuration (TLS 1.2 and 1.3 only)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Connection limits
        limit_conn conn_limit 20;

        # Request size limits
        client_max_body_size 10m;
        client_body_buffer_size 128k;

        # Proxy settings
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 32k;

        # Health check (no rate limit)
        location /health {
            proxy_pass http://solanalm_gateway/health;
        }

        # Public endpoints (moderate rate limit)
        location /v1/models {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://solanalm_gateway/v1/models;
        }

        # Inference endpoints (rate limited)
        location /inference {
            limit_req zone=inference_limit burst=10 nodelay;
            proxy_pass http://solanalm_gateway/inference;
            proxy_read_timeout 300s;  # Longer timeout for inference
        }

        location /v1/chat/completions {
            limit_req zone=inference_limit burst=10 nodelay;
            proxy_pass http://solanalm_gateway/v1/chat/completions;
            proxy_read_timeout 300s;
        }

        location /v1/completions {
            limit_req zone=inference_limit burst=10 nodelay;
            proxy_pass http://solanalm_gateway/v1/completions;
            proxy_read_timeout 300s;
        }

        # Private inference (stricter rate limit)
        location /private_inference {
            limit_req zone=private_inference_limit burst=3 nodelay;
            proxy_pass http://solanalm_gateway/private_inference;
            proxy_read_timeout 300s;
        }

        # Node registration (strict rate limit)
        location /nodes/register {
            limit_req zone=node_register_limit burst=2 nodelay;
            proxy_pass http://solanalm_gateway/nodes/register;
        }

        # Nodes API
        location /nodes {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://solanalm_gateway/nodes;
        }

        # Training endpoints
        location /training {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://solanalm_gateway/training;
            proxy_read_timeout 600s;  # Very long timeout for training
        }

        # Payments endpoints
        location /payments {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://solanalm_gateway/payments;
        }

        # Admin endpoints (protected by auth, moderate limit)
        location /admin {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://solanalm_gateway/admin;
        }

        # Auth endpoints
        location /auth {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://solanalm_gateway/auth;
        }

        # Network stats
        location /network {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://solanalm_gateway/network;
        }

        # Catch-all for other API routes
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://solanalm_gateway;
        }

        # Error pages
        error_page 429 /429.json;
        location = /429.json {
            default_type application/json;
            return 429 '{"error": "rate_limit_exceeded", "message": "Too many requests. Please slow down."}';
        }

        error_page 502 503 504 /50x.json;
        location = /50x.json {
            default_type application/json;
            return 503 '{"error": "service_unavailable", "message": "Service temporarily unavailable. Please try again later."}';
        }
    }
}
