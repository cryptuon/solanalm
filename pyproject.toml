[tool.poetry]
name = "solanalm"
version = "0.1.0"
description = "Decentralized network for LLM inference and federated learning on Solana."
authors = ["Cryptuon Research <contact@cryptuon.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://solanalm.cryptuon.com/"
repository = "https://github.com/cryptuon/solanalm"
documentation = "https://docs.cryptuon.com/solanalm/"
keywords = ["solana", "machine-learning", "llm", "federated-learning", "depin", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.116.1"
uvicorn = "^0.35.0"
pydantic = "^2.11.7"
numpy = "^2.3.2"
pyyaml = "^6.0.2"
requests = "^2.32.5"
aiohttp = "^3.12.15"
transformers = "^4.56.1"
tokenizers = "^0.22.0"
datasets = "^4.0.0"
solana = "^0.36.9"
torch = "^2.1.0"
websockets = "^12.0"
pytest-asyncio = "^0.21.0"
pydantic-settings = "^2.0.0"
llama-cpp-python = "^0.2.0"
openai = "^1.0.0"
anthropic = "^0.8.0"
textual = "^0.50.0"
psutil = "^5.9.0"
# Security dependencies
pynacl = "^1.5.0"
bcrypt = "^4.1.0"
base58 = "^2.1.0"
cryptography = "^45.0.0"
# Database dependencies
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.29.0"
alembic = "^1.13.0"
# Caching dependencies
redis = "^5.0.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
black = "^25.1.0"
flake8 = "^7.3.0"
mypy = "^1.17.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
