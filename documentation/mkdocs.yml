site_name: SolanaLM Documentation
site_description: Enterprise-Grade Decentralized AI Network on Solana
site_author: SolanaLM Team
site_url: https://docs.cryptuon.com/solanalm/

repo_name: cryptuon/solanalm
repo_url: https://github.com/cryptuon/solanalm
edit_uri: edit/main/documentation/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github
  logo: assets/logo.png
  favicon: assets/favicon.ico

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - admonition
  - tables
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Configuration: getting-started/configuration.md
  - User Guides:
    - Python SDK: guides/python-sdk.md
    - Running Nodes: guides/running-nodes.md
    - Terminal TUI: guides/tui.md
    - Web Dashboard: guides/frontend-dashboard.md
    - Federated Learning: guides/federated-learning.md
    - Privacy Features: guides/privacy.md
  - API Reference:
    - Gateway API: api/gateway.md
    - Client SDK: api/client-sdk.md
    - OpenAI Compatibility: api/openai-compat.md
  - Architecture:
    - Overview: architecture/overview.md
    - Node Types: architecture/nodes.md
    - Payment System: architecture/payments.md
  - Deployment:
    - Docker: deployment/docker.md
    - Kubernetes: deployment/kubernetes.md
    - Production: deployment/production.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/solanalm/solanalm
    - icon: fontawesome/brands/discord
      link: https://discord.gg/solanalm
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/SolanaLM

copyright: Copyright &copy; 2025 SolanaLM Team
